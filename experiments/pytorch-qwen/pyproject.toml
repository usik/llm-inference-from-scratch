[project]
name = "pytorch-qwen"
version = "0.1.0"
description = "Run and measure Qwen inference with PyTorch MPS on Apple Silicon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.2",
    "psutil>=6.1",
    "safetensors>=0.5",
    "torch>=2.6",
    "transformers>=4.51",
]

[project.scripts]
qwen-generate = "pytorch_qwen.generate:main"
qwen-preflight = "pytorch_qwen.preflight:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
